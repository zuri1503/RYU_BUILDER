name: RYU BUILDER STOCK
on:
  workflow_dispatch:
    inputs:
      URL:
        description: "OTA PACKAGE URL"
        required: true
      SFU:
        description: "SOURCEFORGE UPLOADER"
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROM_URL: ${{ github.event.inputs.URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk space
        id: diskcheck
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          echo "need_cleanup=$( [ "$FREE_GB" -lt 50 ] && echo true || echo false )" >> $GITHUB_OUTPUT
      - name: Maximize build disk space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
      - name: Start SSH Agent & Add Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_REPO_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Setup build environment
        run: |
          sudo timedatectl set-timezone UTC
          sudo apt-get update -qq
          sudo apt-get install -y aria2 \
            openjdk-17-jdk-headless \
            openssh-client p7zip-full \
            python3 python-is-python3 python3-pip \
            zip zipalign > /dev/null 2>&1
          sudo apt-get remove -y python3-requests || true
          sudo pip install --quiet --break-system-packages \
            lz4 zstandard \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib > /dev/null 2>&1
          DATE=$(TZ=UTC date +"%y%m%d")
          ROM_NAME="$(basename "${ROM_URL%%\?*}")"
          DEVICE=""
          ROM_VER=""
          RYU_NAME=""
          if [[ "$ROM_NAME" == *"-OS"* ]]; then
            if [[ "$ROM_NAME" =~ ^([a-z0-9]+)-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[2]}"
              REGION="${BASH_REMATCH[3]}"
              ROM_VER="${OS_VER%%.*}"
              RYU_NAME="RYUOS_${DEVICE}_${OS_VER}.${REGION}_CN${DATE}"
            elif [[ "$ROM_NAME" =~ ^([a-z0-9]+)_[a-z_]+-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[2]}"
              REGION="${BASH_REMATCH[3]}"
              ROM_VER="${OS_VER%%.*}"
              RYU_NAME="RYUOS_${DEVICE}_${OS_VER}.${REGION}_MI${DATE}"
            else
              echo "::warning::Regex did not match, using fallback name"
              RYU_NAME="RYUOS_${DATE}"
            fi
          else
            echo "::error::Unable to parse ROM name: $ROM_NAME"
            exit 1
          fi
          {
            echo "RYU_NAME=$RYU_NAME"
            echo "DEVICE=${DEVICE,,}"
            echo "ROM_VER=$ROM_VER"
          } >> $GITHUB_ENV
          echo "RYU_NAME=$RYU_NAME | DEVICE=${DEVICE,,} | ROM_VER=$ROM_VER"
      - name: Download ROM files
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/ROM"
          echo "::group::Downloading OTA ROM"
          mkdir -p "$DEST_DIR"
          timeout 9000 aria2c \
            -s16 -x16 -j"$(nproc)" -c \
            -U "Mozilla/5.0" \
            --console-log-level=warn \
            -d "$DEST_DIR" \
            -o "${RYU_NAME}.zip" \
            "$ROM_URL" \
            || { echo "::error::OTA ROM download failed"; exit 1; }
          echo "::endgroup::"
          [ -s "$DEST_DIR/${RYU_NAME}.zip" ] \
            || { echo "::error::Downloaded ROM is missing or empty"; exit 1; }
          echo "Download complete: $(du -h "$DEST_DIR/${RYU_NAME}.zip" | cut -f1)"
      - name: Clone RYU AUTO BUILD sources
        run: |
          RYU_HOME="/home/runner/work/RYU_BUILD/RYU_BUILD"
          echo "RYU_HOME=$RYU_HOME" >> $GITHUB_ENV
          git clone -b stock --depth=1 git@github.com:zuri1503/RYU_BUILD.git "$RYU_HOME"
          mv -f "$GITHUB_WORKSPACE/ROM" "$RYU_HOME/ROM"
          sudo chmod -R +x "$RYU_HOME"
      - name: Build ProjectRYU ROM
        run: |
          sudo bash "$RYU_HOME/build.sh" "$GITHUB_ENV" "$RYU_NAME"
      - name: Upload ROM to Clouds
        run: |
          cd "$RYU_HOME/tools"
          echo "${{ secrets.TOKEN_PICKLE2 }}" | base64 -d > token.pickle
          echo "${{ secrets.UPLOADER }}" | base64 -d > upload.py
          echo "${{ secrets.SF_SSH_KEY }}" > key
          chmod 0600 key token.pickle upload.py
          sf_upload() {
            local src="$1" dest_path="$2"
            [ "${{ github.event.inputs.SFU }}" = "true" ] || return 0
            rsync -a --partial -q \
              -e "ssh -i key -o StrictHostKeyChecking=no" \
              "$src" \
              "zuri1503@frs.sourceforge.net:/home/frs/project/projectzk/ProjectRYU/${dest_path}/" \
              || { echo "::error::rsync failed → $dest_path"; exit 1; }
            echo "Uploaded $(basename "$src") → SF:$dest_path"
            echo "RYU_LINK=https://sourceforge.net/projects/projectzk/files/ProjectRYU/${dest_path}" >> $GITHUB_ENV
          }
          gd_upload() {
            local folder_id="$1"
            [ "${{ github.event.inputs.SFU }}" = "true" ] || return 0
            python upload.py --folder-id "$folder_id" "$ROM_OUTPUT" > /dev/null 2>&1 \
              || { echo "::error::GDrive upload failed (folder: $folder_id)"; exit 1; }
          }
          pd_upload() {
            curl -u ":${{ secrets.PIXELDRAIN_API }}" -X PUT -T "$ROM_OUTPUT" "https://pixeldrain.com/api/file/${RYU_NAME}.zip" > /dev/null 2>&1
          }
          if [ "$IS_GLOBAL" = "true" ]; then
            case "$ROM_VER" in
              OS3)
                SF_PATH="RYU-MI/RYUOS3"
                GD_FOLDER="1pmsZ38_TEBiEYeR4q11BEtCvUAypMUlK"
                ;;
              OS4)
                SF_PATH="RYU-MI/RYUOS4"
                GD_FOLDER="1LiqP2wamVyOk3BH3bgA8yTEb3PaDOUoO"
                ;;
            esac
          else
            case "$ROM_VER" in
              OS3)
                SF_PATH="RYU-CN/RYUOS3"
                GD_FOLDER="1odeqyYjxGQqfeoGesMaPK2XVGJVFSNqp"
                ;;
              OS4)
                SF_PATH="RYU-CN/RYUOS4"
                GD_FOLDER="1JERXVioiHxcyMPaAkQRbKEVtxJlJThAC"
                ;;
            esac
          fi
          sf_upload "$ROM_OUTPUT" "$SF_PATH"
          gd_upload "$GD_FOLDER"
          [ "${{ github.event.inputs.SFU }}" = "false" ] && pd_upload
          rm -f key token.pickle upload.py
      - name: Telegram Notification
        if: env.RYU_LINK != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg chat "-1002030539146" \
            --arg text "✅ <b>NEW BUILD: <a href='${RYU_LINK}/${RYU_NAME}.zip'>${RYU_NAME}.zip</a></b>" \
            '{ chat_id: $chat, text: $text, parse_mode: "HTML" }')
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
